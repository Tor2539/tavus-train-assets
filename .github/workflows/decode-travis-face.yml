name: Decode Travis face JPEG
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble parts and decode native JPEG
        run: |
          set -euo pipefail
          for part in aa ab ac; do
            out="travis-face.b64.${part}"
            : > "$out"
            for i in 0 1 2 3 4 5 6 7; do
              chunk="${out}.${i}"
              # Prefer verified .s* micro-segments over any full chunk (may be corrupted)
              if ls ${chunk}.s[0-9]* >/dev/null 2>&1; then
                cat $(ls ${chunk}.s* | sort -V) >> "$out"
              elif [ -f "$chunk" ] && [ "$(wc -c < "$chunk")" -gt 1000 ] && ! grep -q '^\$file:' "$chunk"; then
                cat "$chunk" >> "$out"
              fi
            done
            echo "part $part bytes=$(wc -c < "$out")"
          done
          cat travis-face.b64.aa travis-face.b64.ab travis-face.b64.ac | base64 -d > travis-face.jpg
          file travis-face.jpg
          python3 - <<'PY2'
          import hashlib, subprocess
          b=open("travis-face.jpg","rb").read()
          assert b[:3]==bytes([255,216,255]), b[:3]
          assert len(b)==63397, len(b)
          assert hashlib.sha1(b).hexdigest()=="cd832e3ebafb2e27354d85a40322358ef0c16c0c"
          out=subprocess.check_output(["file","travis-face.jpg"], text=True)
          assert "1086x1448" in out, out
          print("ok", len(b), out.strip())
          PY2
      - name: Commit assembled parts and JPEG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add travis-face.b64.aa travis-face.b64.ab travis-face.b64.ac travis-face.jpg
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Decode native Travis boardroom JPEG 1086x1448 (q45)"
          git push

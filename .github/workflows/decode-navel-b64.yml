name: decode-navel-b64
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode JPEG
        run: |
          set -euo pipefail
          for i in 00 01 02 03 04 05 06 07 08 09 10 11 12 13 14 15 16; do cat navel-crop.b64.$i; done | tr -d '\r\n' | base64 -d > travis-navel-crop.jpg
          test "$(wc -c < travis-navel-crop.jpg)" -eq 48178
          echo "41c30dd77ac94dd70f79a01b3ca6cc38aa8c2be4  travis-navel-crop.jpg" | sha1sum -c -
          cp travis-navel-crop.jpg travis-face.jpg
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add travis-navel-crop.jpg travis-face.jpg
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Add travis-navel-crop.jpg 1086x1000"
          git push
